name: flutter_tip_calculator
description: A modern, feature-rich tip calculator app with history and sharing capabilities.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  collection: ^1.18.0
  crypto: ^3.0.3
  share_plus: ^10.1.4
  intl: ^0.19.0
  uuid: ^4.5.3
  shared_preferences: ^2.3.3
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
